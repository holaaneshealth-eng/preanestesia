name: CI desarrollo + vista previa en Pages

# En cada push a la rama de desarrollo: instala dependencias, typecheck, pruebas
# (Vitest) y build; si todo está en verde, publica dist/ en GitHub Pages como
# vista previa (con la banda "VERSIÓN DE PRUEBA · NO USAR CON PACIENTES").
on:
  push:
    branches: [desarrollo]

# Permisos necesarios para desplegar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados.
concurrency:
  group: pages-desarrollo
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias (deterministas con package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Pruebas (Vitest)
        run: npx vitest run

      - name: Pruebas E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        # Si aún no hay pruebas E2E, este paso no falla (Playwright sale 0 sin tests).
        continue-on-error: false

      - name: Verificar builds de despliegue (GitHub Pages + Cloudflare main/desarrollo)
        # Compila las tres variantes (incluida la de Cloudflare simulando CF_PAGES=1
        # con CF_PAGES_BRANCH=main y =desarrollo) y comprueba ruta base, banda de prueba
        # y dirección del QR. No despliega nada; solo verifica.
        run: npm run verificar:despliegue

      - name: Build (vista previa de GitHub Pages)
        run: npm run build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
